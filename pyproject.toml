[project]
name = "dyn-evt-pdm"
version = "0.3.0"
description = "Regime-conditioned dynamical extreme value theory for cluster-aware predictive maintenance"
authors = [{ name = "Diogo" }]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11,<3.13"
keywords = [
  "extreme-value-theory",
  "predictive-maintenance",
  "anomaly-detection",
  "industrial-data",
  "survival-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0,<2.3",
  "pandas>=2.2,<3.0",
  "scipy>=1.14,<2.0",
  "scikit-learn>=1.5,<2.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
  "click>=8.0,<8.2",
  "typer[all]>=0.12,<0.13",
  "pyarrow>=23.0.1,<24.0",
  "joblib>=1.4,<2.0",
  "matplotlib>=3.9,<4.0",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/dynamical-evt-pdm"
Repository = "https://github.com/DiogoRibeiro7/dynamical-evt-pdm"

[project.scripts]
dyn-evt = "dyn_evt_pdm.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<0.7",
  "mypy>=1.11,<2.0",
  "pandas-stubs>=2.2,<3.0",
  "types-pyyaml>=6.0,<7.0",
  "pre-commit>=3.8,<4.0",
  "nbformat>=5.10,<6.0",
]

[tool.poetry]
packages = [{ include = "dyn_evt_pdm", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=dyn_evt_pdm --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "integration: requires external data or a long-running experiment",
]

[tool.coverage.run]
branch = true
source = ["dyn_evt_pdm"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
